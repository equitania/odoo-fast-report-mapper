[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-fast-report-mapper-equitania"
dynamic = ["version"]
description = "A Python library for creating, managing, and testing FastReport entries in Odoo environments"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Equitania Software GmbH", email = "info@equitania.de" },
]
keywords = ["odoo", "fastreport", "report", "pdf", "generator", "yaml", "mapping", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: German",
]
dependencies = [
    "odoorpc-toolbox>=0.8.2",
    "click>=8.1.3",
    "PyYAML>=6.0.1",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/equitania/odoo-fast-report-mapper"
"Bug Reports" = "https://github.com/equitania/odoo-fast-report-mapper/issues"
Documentation = "https://www.ownerp.com/odoo-fastreport"
Company = "https://www.equitania.de"

[project.scripts]
odoo-fast-report-mapper = "odoo_fast_report_mapper._cli:start_odoo_fast_report_mapper"
odoo-fr-mapper = "odoo_fast_report_mapper._cli:start_odoo_fast_report_mapper"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.6.0",
    "mypy>=1.18",
    "types-PyYAML>=6.0.0",
    "types-tqdm>=4.66.0",
    "build>=1.0.0",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.6.0",
]

[tool.setuptools.dynamic]
version = { attr = "odoo_fast_report_mapper.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["odoo_fast_report_mapper*"]

[tool.setuptools.package-data]
odoo_fast_report_mapper = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "SIM108",  # use-ternary-operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["odoo_fast_report_mapper"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring Odoo connection",
]

[tool.coverage.run]
source = ["odoo_fast_report_mapper"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/build/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
# warn_return_any and warn_unused_configs are subsumed by strict = true
# ignore_missing_imports removed — replaced by targeted follow_untyped_imports override below

[[tool.mypy.overrides]]
module = "odoorpc_toolbox.*"
follow_untyped_imports = true   # reads source annotations from 0.7.3; no py.typed needed
